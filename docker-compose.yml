services:
  brain:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./agent_data:/app/agent_data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
