name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    needs: secrets-scan
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv httpx pyyaml requests
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/test_security_kernel.py tests/test_filesystem_jail.py tests/test_shell_tool.py tests/test_llm_router.py -v --tb=short

      - name: Coverage report
        run: |
          python -m pytest tests/test_security_kernel.py tests/test_filesystem_jail.py tests/test_shell_tool.py \
            --cov=src/agent/security --cov-report=term-missing --tb=short

  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true  # don't fail CI if Railway token not set yet

  deploy-gcp:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy software-brain \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 1Gi \
            --set-secrets GEMINI_API_KEY=gemini-api-key:latest \
            --quiet
        continue-on-error: true  # don't fail CI if GCP credentials not set yet
