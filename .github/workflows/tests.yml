name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv httpx pyyaml requests
          pip install pytest pytest-cov

      - name: Run security tests (no API keys required)
        run: |
          python -m pytest tests/test_security_kernel.py tests/test_filesystem_jail.py tests/test_shell_tool.py tests/test_llm_router.py -v --tb=short

      - name: Check test coverage
        run: |
          python -m pytest tests/test_security_kernel.py tests/test_filesystem_jail.py tests/test_shell_tool.py --cov=src/agent/security --cov-report=term-missing --tb=short
