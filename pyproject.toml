[project]
name = "software-brain"
version = "1.0.0"
description = "Autonomous AI Agent Platform with multi-provider LLM routing, persistent memory, and business automation"
readme = "README.md"
license = {text = "Private - All Rights Reserved"}
authors = [
    {name = "Abdul Rahaman Khan", email = "mustafaidrishasan20@gmail.com"}
]
keywords = ["ai", "agent", "llm", "automation", "uae", "chatbot", "fastapi"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "google-generativeai>=0.3.0",
    "anthropic>=0.18.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.25.0",
]
browser = [
    "playwright>=1.40.0",
]
voice = [
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.13",
]
ollama = [
    "ollama>=0.1.0",
]

[project.scripts]
software-brain = "smart_agent_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N806"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
