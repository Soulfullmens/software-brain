# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "Software Brain — Gitleaks Config"

[extend]
useDefault = true

[[allowlists]]
description = "Allowlist test fixtures that are intentionally fake"
paths = [
    "test_advanced_security.py",
]
regexes = [
    # Our test file uses obviously fake keys to test the masking feature
    # Pattern: FAKE-TEST-KEY-* (no real prefix like sk-, gsk-, etc.)
    "FAKE-TEST-KEY-[a-z0-9]+",
]
